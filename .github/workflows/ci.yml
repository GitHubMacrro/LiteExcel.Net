name: CI

on:
  push:
  pull_request:

jobs:
  build-test-pack:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build LiteExcel.sln -c Release

      - name: Test
        run: dotnet test LiteExcel.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/LiteExcel/LiteExcel.csproj -c Release --no-build
