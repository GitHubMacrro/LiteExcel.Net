name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build LiteExcel.sln -c Release

      - name: Test
        run: dotnet test LiteExcel.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/LiteExcel/LiteExcel.csproj -c Release -o nupkg

      - name: NuGet Login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: JackZ

      - name: Push to nuget.org
        shell: pwsh
        run: |
          $pkg = Get-ChildItem nupkg/*.nupkg | Select-Object -First 1
          dotnet nuget push $pkg.FullName
                 --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
                 --source https://www.nuget.org/api/v2/package
                 --skip-duplicate
